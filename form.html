<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A dynamic product review form that can be submitted for WDD 131.">
    <meta name="author" content="Caden Barnett Griffin">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            
            <label for="product-select">Product Name</label>
            <select id="product-select" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <input type="radio" id="star1" name="overallRating" value="1" required>
                    <label for="star1">☆</label>

                    <input type="radio" id="star2" name="overallRating" value="2" required>
                    <label for="star2">☆☆</label>

                    <input type="radio" id="star3" name="overallRating" value="3" required>
                    <label for="star3">☆☆☆</label>

                    <input type="radio" id="star4" name="overallRating" value="4" required>
                    <label for="star4">☆☆☆☆</label>

                    <input type="radio" id="star5" name="overallRating" value="5" required>
                    <label for="star5">☆☆☆☆☆</label>
                </div>
            </fieldset>

            <label for="install-date">Date of Installation</label>
            <input type="date" id="install-date" name="installDate" required>

            <fieldset>
            <legend>Which features did you find useful? (Check all that apply)</legend>

            <input type="checkbox" id="feature-durability" name="features" value="durability">
            <label for="feature-durability">Durability</label>

            <input type="checkbox" id="feature-ease" name="features" value="ease">
            <label for="feature-ease">Ease of Use</label>

            <input type="checkbox" id="feature-performance" name="features" value="performance">
            <label for="feature-performance">Performance</label>

            <input type="checkbox" id="feature-design" name="features" value="design">
            <label for="feature-design">Design</label>
            </fieldset>

            <label for="written-review">Written Review (Optional)</label>
            <textarea id="written-review" name="writtenReview" rows="5"></textarea>

            <label for="user-name">Your Name (Optional)</label>
            <input type="text" id="user-name" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="year"></span> Caden Griffin</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
